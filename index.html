<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f5a43"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>মাদরাসা ব্যবস্থাপনা</title>
<style>
:root{--bg:#f2f6f3;--sf:#fff;--tx:#13231b;--mu:#5a6a62;--pr:#0f5a43;--on:#fff;--ac:#b8892b;--bd:#d3ded7;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--sf:#17231d;--tx:#e6efe9;--mu:#9db1a6;--pr:#4cb08a;--on:#08110d;--ac:#d9a94a;--bd:#2b3a33;--dg:#f2918b}}
:root[data-theme="dark"]{--bg:#0e1612;--sf:#17231d;--tx:#e6efe9;--mu:#9db1a6;--pr:#4cb08a;--on:#08110d;--ac:#d9a94a;--bd:#2b3a33;--dg:#f2918b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:20}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;display:flex;align-items:center;gap:12px;background:var(--pr);color:var(--on);padding:10px 14px;font-weight:700}
#bar button{background:none;border:0;color:inherit;font-size:24px;line-height:1;cursor:pointer}
#menu{display:none;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:19;background:var(--sf);border-bottom:2px solid var(--ac);box-shadow:0 8px 20px #0003}
#menu.open{display:block}#menu a{display:block;padding:13px 18px;border-bottom:1px solid var(--bd);cursor:pointer}#menu a.on{color:var(--pr);font-weight:700;background:var(--bg)}
main{max-width:760px;margin:0 auto;padding:14px}h2{margin:6px 0 12px;font-size:22px;color:var(--pr)}h3{margin:0 0 8px;font-size:17px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0}input,select,textarea{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-top:3px}
textarea{min-height:70px}.btn{display:inline-block;background:var(--pr);color:var(--on);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.ghost{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.red{background:var(--dg);color:var(--on)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.row:last-child{border:0}.row span,.mu{color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mu)}.stat b{display:block;font-size:20px;color:var(--tx)}
.stat.i b{color:var(--pr)}.stat.e b{color:var(--dg)}
.hero{height:290px;border-radius:12px;background:linear-gradient(135deg,var(--pr),#0a3326) center/cover;display:flex;align-items:flex-end;overflow:hidden;position:relative;margin-bottom:8px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#000b,transparent 45%,#000b)}
.slide{position:relative;z-index:1;color:#fff;font-size:22px;font-weight:700;padding:18px;opacity:0;text-shadow:0 2px 6px #000}.slide.in{animation:sl 3s both}
@keyframes sl{0%{opacity:0;transform:translateX(70px)}15%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-70px)}}
@media(prefers-reduced-motion:reduce){.slide.in{animation:none;opacity:1}}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--bd);padding:5px 6px;text-align:center;white-space:nowrap}td.l{text-align:left}th{background:var(--bg)}
td input{width:62px;padding:5px;margin:0;text-align:center}.sheet{text-align:center}.sheet img{height:64px}.sheet h3{font-size:20px;margin:4px 0}
#m .modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}#m .box{background:var(--sf);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
dl{margin:0}dt{font-size:13px;color:var(--mu)}dd{margin:0 0 8px}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}#t.on{opacity:1}
@media print{:root:not(#z){--bg:#fff;--sf:#fff;--tx:#000;--mu:#333;--bd:#888}#bar,#menu,.noprint,body::before{display:none!important}.card{border:0;padding:0}td input{border:0;background:none}body.pm main{display:none}body.pm #m .modal{position:static;background:none;display:block}body.pm #m .box{max-height:none;overflow:visible;padding:0;border-radius:0}}
[hidden]{display:none!important}.clk{position:absolute;top:0;left:0;right:56px;z-index:2;padding:12px 14px;color:#fff;text-shadow:0 1px 5px #000;font-size:13px;line-height:1.5}#tm{font-size:28px;font-weight:700;line-height:1.3}.cam{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;margin:0;border-radius:50%;background:#0009;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.bigcam{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;margin:0;color:var(--on);font-size:15px}.annt{min-height:48px;font-size:17px;font-weight:600;padding:4px 0}.annt.in{animation:an .6s both}@keyframes an{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bd);margin-right:5px}.dots i.on{background:var(--pr)}.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pt div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;text-align:center;padding:8px 2px;font-size:13px;color:var(--mu)}.pt b{display:block;font-size:15px;color:var(--tx)}.pt .nx{border-color:var(--pr)}.pt .nx b{color:var(--pr)}@media(prefers-reduced-motion:reduce){.annt.in{animation:none}}
</style></head><body>
<header id="bar"><button onclick="$('menu').classList.toggle('open')" aria-label="মেনু">☰</button><span id="ttl"></span></header>
<nav id="menu"></nav><main id="app"></main><div id="m"></div><div id="t"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),tk=n=>'৳'+bn((+n).toLocaleString('en-US')),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10);
const MN=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'],FN={a:'১ম ফি',b:'২য় ফি',c:'বার্ষিক ফি'},FUND={g:'সাধারণ ফান্ড',u:'গুরাবা ফান্ড'};
const NAV=[['home','হোম'],['info','প্রতিষ্ঠান তথ্য'],['money','মাদরাসার আয় ব্যয়'],['stu','শিক্ষার্থী ব্যবস্থাপনা'],['tea','শিক্ষক ব্যবস্থাপনা'],['exam','পরীক্ষা বিভাগ'],['fee','বেতন ও ফি ব্যবস্থাপনা'],['prof','আমার প্রোফাইল'],['admin','এডমিন প্যানেল']];
let S={users:[],info:{name:'',addr:'',phone:'',fb:'',img:'',logo:'',depts:'নূরানী, নাজেরা, হিফজ, ১ম শ্রেণি, ২য় শ্রেণি, ৩য় শ্রেণি'},st:[],te:[],tx:[],fee:{},ex:{year:'',subs:[],roll:{},marks:{}}};
try{const d=localStorage.getItem('madrasa');if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}
const save=()=>{try{localStorage.setItem('madrasa',JSON.stringify(S))}catch(e){toast('সংরক্ষণ করা যায়নি')}};
const cls=()=>S.info.depts.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
let V='home',C='',MO=today().slice(0,7),T,ME=null;
function toast(t){const e=$('t');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function mod(h){$('m').innerHTML='<div class="modal" onclick="if(event.target==this)closeM()"><div class="box">'+h+'</div></div>'}function closeM(){$('m').innerHTML=''}
const fld=(id,l,t='text',v='')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;
const clsSel=(id,fn)=>{const L=cls();if(!L.includes(C))C=L[0]||'';return `<select ${id?`id="${id}"`:''} ${fn?`onchange="${fn}"`:''}>${L.map(c=>`<option ${c==C?'selected':''}>${esc(c)}</option>`).join('')}</select>`};
function go(v){V=v;$('menu').classList.remove('open');render();scrollTo(0,0)}
function render(){if(!ME)return gate();if(ME.role!='admin'&&!OK.includes(V))V='home';$('menu').innerHTML=NAV.filter(n=>ME.role=='admin'||OK.includes(n[0])).map(n=>`<a class="${n[0]==V?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')+'<a onclick="logout()">লগআউট</a>';$('ttl').textContent=NAV.find(n=>n[0]==V)[1]=='হোম'?(S.info.name||'মাদরাসা ব্যবস্থাপনা'):NAV.find(n=>n[0]==V)[1];$('app').innerHTML=views[V]();clearInterval(T);if(V=='home')slides()}
function pic(el,key,w){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.info[key]=c.toDataURL(key=='logo'?'image/png':'image/jpeg',.72);save();render()};im.src=r.result};r.readAsDataURL(f)}
const views={
home(){const i=S.info,ad=ME&&ME.role=='admin',inp='<input type="file" accept="image/*" hidden onchange="pic(this,\'img\',1000)">',cam=ad?(i.img?`<label class="cam" title="ছবি পরিবর্তন">📷${inp}</label>`:`<label class="btn bigcam">📷 মাদরাসার ছবি যোগ করুন${inp}</label>`):'';
return `<div class="hero" style="${i.img?`background-image:url('${i.img}')`:''}"><div class="clk"><div id="tm"></div><div id="dt"></div></div>${cam}<div class="slide" id="slide"></div></div><div class="card"><div class="mu">📢 ঘোষণা${ad?` <span onclick="annForm()" style="color:var(--pr);cursor:pointer;float:right">সম্পাদনা</span>`:''}</div><div id="annt" class="annt"></div><div id="annd" class="dots"></div></div><div class="grid"><div class="stat"><b>${bn(S.st.length)}</b>শিক্ষার্থী</div><div class="stat"><b>${bn(S.te.length)}</b>শিক্ষক</div></div><div class="card"><h3>নামাজের ওয়াক্ত</h3><div id="pray"></div></div>`},
info(){const i=S.info;return `<h2>প্রতিষ্ঠান তথ্য</h2><div class="card">${fld('n','প্রতিষ্ঠানের নাম','text',i.name)}${fld('ad','ঠিকানা','text',i.addr)}${fld('ph','যোগাযোগ নাম্বার','tel',i.phone)}${fld('fb','ফেসবুক পেজ (লিংক)','url',i.fb)}<label>বিভাগসমূহ (কমা দিয়ে আলাদা করুন)<textarea id="d">${esc(i.depts)}</textarea></label><h3 style="margin-top:14px">নামাজের সময় ও তারিখ</h3>${fld('la','অক্ষাংশ (Latitude)','text',i.lat||23.8103)}${fld('lo','দ্রাঘিমাংশ (Longitude)','text',i.lng||90.4125)}<p class="mu">ডিফল্ট ঢাকার অবস্থান। নিজের এলাকার মান দিলে সময় আরও কাছাকাছি হবে। নিচে সময় লিখলে সেটাই দেখাবে, ফাঁকা রাখলে অটো হিসাব হবে।</p>${['ফজর','যোহর','আছর','মাগরিব','এশা'].map((n,k)=>fld('pf'+k,n+' (ঐচ্ছিক)','time',(i.pt||[])[k]||'')).join('')}<label>হিজরি তারিখ সমন্বয়<select id="ho">${[-2,-1,0,1,2].map(v=>`<option value="${v}" ${(i.ho||0)==v?'selected':''}>${v>0?'+':''}${bn(v)} দিন</option>`).join('')}</select></label><button class="btn" onclick="saveInfo()">সংরক্ষণ করুন</button>${i.fb?`<a class="btn ghost" href="${esc(i.fb)}" target="_blank" rel="noopener">ফেসবুক পেজ</a>`:''}</div><div class="card"><h3>শিক্ষকমণ্ডলী</h3>${S.te.length?S.te.map(t=>`<div class="row">${esc(t.name)}<span>${esc(t.qual)}</span></div>`).join(''):'<p class="mu">শিক্ষক ব্যবস্থাপনা থেকে শিক্ষক যোগ করুন।</p>'}</div><div class="card"><h3>বিভাগসমূহ</h3>${cls().map(c=>`<div class="row">${esc(c)}<span>${bn(S.st.filter(s=>s.cls==c).length)} জন</span></div>`).join('')}</div>`},
money(){const y=MO.slice(0,4),sum=(f,t)=>S.tx.filter(x=>x.t==t&&f(x.d)).reduce((a,x)=>a+x.a,0),bal=f=>S.tx.filter(x=>x.f==f).reduce((a,x)=>a+(x.t=='i'?x.a:-x.a),0),l=S.tx.filter(x=>x.d.slice(0,7)==MO).sort((a,b)=>b.d<a.d?-1:1);
return `<h2>মাদরাসার আয় ব্যয়</h2><label>মাস নির্বাচন<input type="month" value="${MO}" onchange="MO=this.value||MO;render()"></label><div class="grid"><div class="stat i"><b>${tk(sum(d=>d.slice(0,7)==MO,'i'))}</b>মাসিক আয়</div><div class="stat e"><b>${tk(sum(d=>d.slice(0,7)==MO,'e'))}</b>মাসিক ব্যয়</div><div class="stat i"><b>${tk(sum(d=>d.startsWith(y),'i'))}</b>বাৎসরিক আয় (${bn(y)})</div><div class="stat e"><b>${tk(sum(d=>d.startsWith(y),'e'))}</b>বাৎসরিক ব্যয় (${bn(y)})</div><div class="stat"><b>${tk(bal('g'))}</b>সাধারণ ফান্ড (জমা)</div><div class="stat"><b>${tk(bal('u'))}</b>গুরাবা ফান্ড (জমা)</div></div>
<div class="card"><h3>আয় / ব্যয় যোগ করুন</h3><label>ধরন<select id="t1" onchange="txUI()"><option value="i">আয়</option><option value="e">ব্যয়</option></select></label><label>ফান্ড<select id="f1" onchange="txUI()"><option value="g">সাধারণ ফান্ড</option><option value="u">গুরাবা ফান্ড</option></select></label>${fld('a1','টাকার পরিমাণ','number')}${fld('s1','বিবরণ')}${fld('d1','তারিখ','date',today())}<div id="xi"><label id="khl" style="display:none">খাত<select id="kh">${['যাকাত','ফিতরা','মান্নত','চামড়ার মূল্য','দান'].map(k=>`<option>${k}</option>`).join('')}</select></label>${fld('rc','রিসিট নং')}</div><div id="xe" style="display:none">${fld('vn','ভাউচার নং')}<label>মেমো/ভাউচারের ছবি<input id="vi" type="file" accept="image/*"></label></div><button class="btn" onclick="addTx()">যোগ করুন</button><p class="mu">শিক্ষার্থীদের বেতন ও ফি জমা দিলে স্বয়ংক্রিয়ভাবে সাধারণ ফান্ডে আয় হিসেবে যোগ হয়।</p></div>
<div class="card"><h3>এই মাসের তালিকা</h3>${l.length?l.map(x=>`<div class="row" style="cursor:default"><div>${esc(x.s)}<br><span>${bn(x.d)} · ${FUND[x.f]}${x.kh?' · '+x.kh:''}${x.rc?' · রিসিট '+esc(bn(x.rc)):''}${x.vn?' · ভাউচার '+esc(bn(x.vn)):''}</span>${x.vi?` <a style="color:var(--pr);cursor:pointer" onclick="shImg('${x.id}')">ছবি</a>`:''}</div><div style="color:var(${x.t=='i'?'--pr':'--dg'});text-align:right">${x.t=='i'?'+':'−'}${tk(x.a)}<br><span onclick="delTx('${x.id}')" style="cursor:pointer;color:var(--dg)">মুছুন</span></div></div>`).join(''):'<p class="mu">এই মাসে কোনো হিসাব নেই।</p>'}</div>`},
stu(){const l=S.st.filter(s=>s.cls==C||!C);return `<h2>শিক্ষার্থী ব্যবস্থাপনা</h2>${clsSel('','C=this.value;render()')}<div class="card">${l.length?l.map((s,i)=>`<div class="row" onclick="stDet('${s.id}')">${bn(i+1)}. ${esc(s.name)}<span>${esc(s.fa)}</span></div>`).join(''):'<p class="mu">এই ক্লাসে কোনো শিক্ষার্থী নেই।</p>'}</div><button class="btn" onclick="stForm()">শিক্ষার্থী যোগ করুন</button>`},
tea(){return `<h2>শিক্ষক ব্যবস্থাপনা</h2><div class="card">${S.te.length?S.te.map(t=>`<div class="row" onclick="teDet('${t.id}')">${esc(t.name)}<span>${esc(t.qual)}</span></div>`).join(''):'<p class="mu">কোনো শিক্ষক যোগ করা হয়নি।</p>'}</div><button class="btn" onclick="teForm()">শিক্ষক যোগ করুন</button>`},

return `<h2>পরীক্ষা বিভাগ</h2><div class="card noprint">${clsSel('','C=this.value;render()')}${fld('y','শিক্ষাবর্ষ','text',E.year)}<label>সাবজেক্ট যোগ করুন<input id="sb" placeholder="যেমন: আরবি"></label><button class="btn" onclick="addSub()">সাবজেক্ট যোগ</button><label class="btn ghost" style="display:inline-block">লোগো আপলোড<input type="file" accept="image/*" hidden onchange="pic(this,'logo',300)"></label><button class="btn" onclick="S.ex.year=$('y').value;save();pdf(document.querySelector('.sheet'),'result')">পিডিএফ ডাউনলোড</button></div>

async function saveFile(blob,name){try{const P=window.Capacitor&&window.Capacitor.Plugins;if(P&&P.Filesystem&&P.Share){const b=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});const w=await P.Filesystem.writeFile({path:name,data:b,directory:'CACHE'});await P.Share.share({title:name,url:w.uri,dialogTitle:'সংরক্ষণ করুন'});return}
const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){if(!e||e.name!='AbortError')toast('সংরক্ষণ করা যায়নি')}}

const PCSS='*{box-sizing:border-box}div,table,span{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;color:#000}.sheet{text-align:center;background:#fff;padding:20px;font-size:16px;line-height:1.6}.sheet img{height:64px}.sheet img[style]{height:96px}.sheet h3{font-size:20px;margin:4px 0}.wrap{overflow:visible}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #888;padding:5px 6px;text-align:center;white-space:nowrap}td.l{text-align:left}th{background:#eee}';
function mkpdf(j,w,h){const E=s=>new TextEncoder().encode(s),parts=[],off=[];let n=0;const add=b=>{parts.push(b);n+=b.length},ob=(i,s)=>{off[i]=n;add(E(i+' 0 obj\n'+s+'\nendobj\n'))};
const L=w>h,PW=L?842:595,PH=L?595:842,sc=Math.min((PW-40)/w,(PH-40)/h),iw=w*sc,ih=h*sc,cs=`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${((PW-iw)/2).toFixed(2)} ${(PH-20-ih).toFixed(2)} cm /I Do Q`;
add(E('%PDF-1.4\n'));ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');ob(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</I 5 0 R>>>>/Contents 4 0 R>>`);ob(4,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
off[5]=n;add(E(`5 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.length}>>\nstream\n`));add(j);add(E('\nendstream\nendobj\n'));
const xr=n;let t='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<6;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';add(E(t+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`));return new Blob(parts,{type:'application/pdf'})}
async function pdf(el,nm){if(!el){toast('কিছু পাওয়া যায়নি');return}try{toast('পিডিএফ তৈরি হচ্ছে…');
const tb=el.querySelector('table'),W=Math.ceil(Math.max(el.scrollWidth,tb?tb.scrollWidth+44:0,360)),H=el.scrollHeight+60,c=el.cloneNode(true),oi=[...el.querySelectorAll('input')];
c.querySelectorAll('input').forEach((i,k)=>{const s=document.createElement('span');s.textContent=oi[k]?oi[k].value:'';i.replaceWith(s)});c.querySelectorAll('.noprint').forEach(e=>e.remove());c.classList.add('sheet');c.style.width=W+'px';
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${PCSS}</style>${new XMLSerializer().serializeToString(c)}</div></foreignObject></svg>`;
const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
const j=Uint8Array.from(atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0));await saveFile(mkpdf(j,cv.width,cv.height),nm+'-'+today()+'.pdf')}catch(e){toast('পিডিএফ তৈরি করা যায়নি')}}
const HM=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শা’বান','রমজান','শাওয়াল','জিলকদ','জিলহজ'],BM=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'],BS=[[4,14],[5,15],[6,15],[7,16],[8,16],[9,16],[10,16],[11,15],[12,15],[1,14],[2,13],[3,15]],WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
function bdate(d){const y=d.getFullYear(),t=new Date(y,d.getMonth(),d.getDate());let b=null;for(const Y of[y-1,y])BS.forEach((s,i)=>{const sd=new Date(Y,s[0]-1,s[1]);if(sd<=t&&(!b||sd>b.sd))b={sd,i}});return bn(Math.round((t-b.sd)/864e5)+1)+' '+BM[b.i]+' '+bn(b.sd.getFullYear()-(b.i<9?593:594))}
function hdate(d,off){try{const x=new Date(d.getTime()+off*864e5),p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(x),g=t=>+p.find(a=>a.type==t).value;return bn(g('day'))+' '+HM[g('month')-1]+' '+bn(g('year'))+' হিজরি'}catch(e){return ''}}
function dts(d){return `<div>${d.toLocaleDateString('en-US',{weekday:'long'})}, ${d.getDate()} ${d.toLocaleDateString('en-US',{month:'long'})} ${d.getFullYear()}</div><div>${WD[d.getDay()]}, ${bdate(d)}</div><div>${hdate(d,+S.info.ho||0)}</div>`}
function clk(d){const h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),p=h<3?'রাত':h<6?'ভোর':h<12?'সকাল':h<15?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত',z=x=>String(x).padStart(2,'0');return p+' '+bn(h%12||12)+':'+bn(z(m))+':'+bn(z(s))}
function ptimes(d,lat,lng){const r=Math.PI/180,sn=x=>Math.sin(x*r),cs=x=>Math.cos(x*r),tn=x=>Math.tan(x*r),as=x=>Math.asin(x)/r,ac=x=>Math.acos(x)/r,fx=(a,b)=>a-b*Math.floor(a/b),jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5-lng/360,tz=-d.getTimezoneOffset()/60;
const sp=t=>{const D=jd+t-2451545,g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*sn(g)+.02*sn(2*g),360),e=23.439-3.6e-7*D,RA=Math.atan2(cs(e)*sn(L),cs(L))/r/15;return{dc:as(sn(e)*sn(L)),eq:q/15-fx(RA,24)}};
const mid=t=>fx(12-sp(t).eq,24),sat=(a,t,ccw)=>{const dc=sp(t).dc,h=ac((-sn(a)-sn(dc)*sn(lat))/(cs(dc)*cs(lat)))/15;return mid(t)+(ccw?-h:h)},asr=t=>{const dc=sp(t).dc;return sat(-Math.atan(1/(2+tn(Math.abs(lat-dc))))/r,t)},adj=h=>h+tz-lng/15;
return [sat(18,5/24,1),sat(.833,6/24,1),mid(.5),asr(13/24),sat(.833,18/24),sat(18,18/24)].map(adj)}
function prayHtml(){const i=S.info,now=new Date(),nm=now.getHours()*60+now.getMinutes(),pt=ptimes(now,+i.lat||23.8103,+i.lng||90.4125),N=['ফজর','যোহর','আছর','মাগরিব','এশা'],ix=[0,2,3,4,5],md=x=>((Math.round(x)%1440)+1440)%1440,M=ix.map((k,j)=>{const o=(i.pt||[])[j];if(o){const q=o.split(':');return+q[0]*60+ +q[1]}return md(pt[k]*60)}),f=m=>bn((Math.floor(m/60)%12||12)+':'+String(m%60).padStart(2,'0'));
let nx=M.findIndex(m=>m>nm),dif;if(nx<0){nx=0;dif=M[0]+1440-nm}else dif=M[nx]-nm;const hh=Math.floor(dif/60),mm=dif%60;
return `<div class="pt">${N.map((n,j)=>`<div class="${j==nx?'nx':''}">${n}<b>${f(M[j])}</b></div>`).join('')}</div><p class="mu" style="margin:8px 0 0">পরবর্তী: <b>${N[nx]}</b> (${hh?bn(hh)+' ঘণ্টা ':''}${bn(mm)} মিনিট পর) · সূর্যোদয় ${f(md(pt[1]*60))}</p>`}
function annTick(n){const L=S.notices||[],e=$('annt');if(!e)return;if(!L.length){e.textContent='এখনো কোনো ঘোষণা নেই';$('annd').innerHTML='';return}const j=n%L.length;e.classList.remove('in');void e.offsetWidth;e.textContent=L[j].t;e.classList.add('in');$('annd').innerHTML=L.map((_,q)=>`<i class="${q==j?'on':''}"></i>`).join('')}
function slides(){const i=S.info,a=[i.name||'মাদরাসার নাম',i.addr||'ঠিকানা যোগ করুন','যোগাযোগ: '+bn(i.phone||'—')];let k=0,an=0;const tick=()=>{if(!$('tm')){clearInterval(T);return}const d=new Date();$('tm').textContent=clk(d);
